<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Defense COP v2.0 - Tactical Command Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #080c14;
            --card-color: #111827;
            --border-color: #1f2937;
            --accent-cyan: #00e5ff;
            --accent-green: #10b981;
            --accent-yellow: #f59e0b;
            --accent-red: #ef4444;
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Outfit', sans-serif;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: linear-gradient(180deg, rgba(17,24,39,0.8) 0%, rgba(17,24,39,0) 100%);
            border-bottom: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header-title h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(90deg, #fff 0%, var(--accent-cyan) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--accent-green);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--accent-green);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-green);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.6; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.6; }
        }

        .main-container {
            display: grid;
            grid-template-columns: 1.5fr 1fr 1fr;
            gap: 20px;
            padding: 20px 30px;
            flex-grow: 1;
            height: calc(100vh - 80px);
            min-height: 0; /* Important for grid inner scrolling */
        }

        .panel {
            background-color: var(--card-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        .panel-header {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
            color: var(--accent-cyan);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-body {
            flex-grow: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #060910;
            overflow: hidden;
        }

        #video-feed, #bev-feed {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* Alerts and logs */
        .logs-body {
            flex-grow: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background-color: #090e17;
        }

        .alert-card {
            background: #111827;
            border-left: 4px solid var(--accent-cyan);
            padding: 12px;
            border-radius: 0 8px 8px 0;
            display: flex;
            flex-direction: column;
            gap: 5px;
            transition: all 0.2s ease;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.9rem;
        }

        .alert-card.CRITICAL { border-left-color: var(--accent-red); background: rgba(239, 68, 68, 0.05); }
        .alert-card.HIGH { border-left-color: var(--accent-yellow); background: rgba(245, 158, 11, 0.05); }
        .alert-card.WARNING { border-left-color: var(--accent-yellow); }
        .alert-card.LOW { border-left-color: var(--accent-green); }

        .alert-header {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
        }

        .severity-badge {
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }

        .severity-badge.CRITICAL { background-color: var(--accent-red); color: white; }
        .severity-badge.HIGH { background-color: var(--accent-yellow); color: black; }
        .severity-badge.LOW { background-color: var(--accent-green); color: white; }

        .alert-details {
            color: var(--text-secondary);
            font-size: 0.8rem;
        }

        /* Stats panel */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            padding: 15px;
            background: var(--card-color);
            border-top: 1px solid var(--border-color);
        }

        .stat-item {
            background: #090e17;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .stat-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-secondary);
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent-cyan);
            font-family: 'Share Tech Mono', monospace;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #090e17;
        }
        ::-webkit-scrollbar-thumb {
            background: #1f2937;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #374151;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-title">
            <h1>DEFENSE COP v2.0</h1>
            <span class="status-badge">
                <span class="status-dot"></span>
                <span>TACTICAL FEED ACTIVE</span>
            </span>
        </div>
        <div style="font-family: 'Share Tech Mono', monospace; color: var(--accent-cyan); font-size: 1.1rem;" id="time-display">
            00:00:00 UTC
        </div>
    </header>

    <div class="main-container">
        <!-- Live Video Feed -->
        <div class="panel">
            <div class="panel-header">
                <span>Tactical Video Stream</span>
                <span style="font-size: 0.75rem; color: var(--text-secondary);" id="fps-display">FPS: --</span>
            </div>
            <div class="panel-body">
                <img id="video-feed" src="" alt="Awaiting tactical stream..." />
            </div>
        </div>

        <!-- Bird's Eye View Feed -->
        <div class="panel">
            <div class="panel-header">
                <span>Bird's Eye View (BEV) Map</span>
            </div>
            <div class="panel-body">
                <img id="bev-feed" src="" alt="Awaiting BEV coordinate mapping..." />
            </div>
        </div>

        <!-- Alerts Log & Targets -->
        <div class="panel">
            <div class="panel-header">
                <span>Threats & Anomalies Log</span>
                <span id="target-count" class="severity-badge LOW">Active Targets: 0</span>
            </div>
            <div id="logs-container" class="logs-body">
                <div class="alert-card LOW">
                    <div class="alert-header">
                        <span>SYSTEM INITIALIZATION</span>
                        <span class="severity-badge LOW">INFO</span>
                    </div>
                    <div class="alert-details">
                        FastAPI WebSockets Tactical Command interface ready. Awaiting connection...
                    </div>
                </div>
            </div>
            <div class="stats-grid">
                <div class="stat-item">
                    <span class="stat-label">Active Targets</span>
                    <span class="stat-value" id="stats-targets">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Anomalies Detected</span>
                    <span class="stat-value" id="stats-anomalies" style="color: var(--accent-yellow);">0</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${wsProtocol}//${window.location.host}/ws`;
        let socket;
        let anomalyCount = 0;
        let knownAnomalies = new Set();

        function connect() {
            socket = new WebSocket(wsUrl);

            socket.onopen = () => {
                console.log("Tactical socket connected.");
            };

            socket.onmessage = (event) => {
                const data = JSON.parse(event.data);
                
                // Update images
                if (data.frame) {
                    document.getElementById('video-feed').src = 'data:image/jpeg;base64,' + data.frame;
                }
                if (data.bev) {
                    document.getElementById('bev-feed').src = 'data:image/jpeg;base64,' + data.bev;
                }

                // Update Stats
                const activeTargets = data.alerts ? data.alerts.length : 0;
                document.getElementById('target-count').innerText = `Active Targets: ${activeTargets}`;
                document.getElementById('stats-targets').innerText = activeTargets;

                // Process Alerts
                if (data.alerts) {
                    let activeAnomalies = 0;
                    data.alerts.forEach(alert => {
                        if (alert.threat_class !== "LOW") {
                            activeAnomalies++;
                            
                            // Check if this is a new anomaly event to log it
                            const alertKey = `${alert.target_id}-${alert.threat_class}`;
                            if (!knownAnomalies.has(alertKey)) {
                                knownAnomalies.add(alertKey);
                                anomalyCount++;
                                document.getElementById('stats-anomalies').innerText = anomalyCount;
                                
                                logAnomaly(alert);
                            }
                        }
                    });
                }
            };

            socket.onclose = () => {
                console.log("Socket closed. Retrying connection in 2 seconds...");
                setTimeout(connect, 2000);
            };

            socket.onerror = (err) => {
                console.error("Socket error: ", err);
                socket.close();
            };
        }

        function logAnomaly(alert) {
            const logsContainer = document.getElementById('logs-container');
            const card = document.createElement('div');
            card.className = `alert-card ${alert.threat_class}`;
            
            const timestamp = new Date().toLocaleTimeString();
            
            card.innerHTML = `
                <div class="alert-header">
                    <span>TARGET #${alert.target_id} (${alert.class_name.toUpperCase()})</span>
                    <span class="severity-badge ${alert.threat_class}">${alert.threat_class}</span>
                </div>
                <div class="alert-details">
                    Time: ${timestamp} | Threat Score: ${alert.threat_score.toFixed(1)}<br>
                    Factors: ${alert.contributing_factors.join(', ') || 'N/A'}
                </div>
            `;
            
            logsContainer.prepend(card);
            
            // Limit log items in UI
            if (logsContainer.children.length > 50) {
                logsContainer.removeChild(logsContainer.lastChild);
            }
        }

        // Live clock
        setInterval(() => {
            document.getElementById('time-display').innerText = new Date().toUTCString().replace('GMT', 'UTC');
        }, 1000);

        connect();
    </script>
</body>
</html>
